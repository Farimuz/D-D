name: PR 1-A map regression comparison
on:
  push:
    branches: [audit/pr1a-edge-baseline]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  map-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-main
            ref: a70014a152a0e763aed6ebdc99a226362b2891ca
          - label: pr1a
            ref: 7979971d29631bc565eb33b50041ed97027423b0
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout comparison revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Use Node 22.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Edge for deterministic test
        run: npx playwright install --with-deps msedge
      - name: Build
        run: npm run build
      - name: Repeat same failing E2E test twice
        shell: bash
        run: |
          echo "revision: $(git rev-parse HEAD)"
          failures=0
          for run in 1 2; do
            echo "RUN $run, variant ${{ matrix.label }}"
            npx playwright test tests/e2e/map.spec.ts --project=edge --grep 'map adjustment never moves tokens' || failures=$((failures + 1))
          done
          echo "variant=${{ matrix.label }} failed_attempts=$failures"
          test "$failures" -eq 0
      - name: Preserve negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1a-edge-${{ matrix.label }}
          path: test-results/
          if-no-files-found: ignore
